version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The MSRV job pins dtolnay/rust-toolchain@1.88 on purpose: that tag is
      # the minimum supported Rust version, not an outdated action.
      - dependency-name: dtolnay/rust-toolchain
